basePath: /
definitions:
  dto.AuthResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/dto.UserProfile'
    type: object
  dto.ChangePasswordRequest:
    properties:
      new_password:
        example: new_secret123
        minLength: 6
        type: string
      old_password:
        example: old_secret
        type: string
    required:
    - new_password
    - old_password
    type: object
  dto.CheckInRequest:
    properties:
      code:
        example: EVT-TK-1A2B3C4D5E6F
        type: string
    required:
    - code
    type: object
  dto.CheckInResponse:
    properties:
      checked_by:
        type: string
      checked_in_at:
        type: string
      customer_name:
        type: string
      event_name:
        type: string
      ticket_code:
        type: string
      ticket_id:
        type: integer
      tier_name:
        type: string
    type: object
  dto.CreateEventRequest:
    properties:
      description:
        example: Biggest tech summit in Indonesia
        type: string
      end_at:
        example: "2026-10-15T18:00:00Z"
        type: string
      location:
        example: Jakarta Convention Center
        maxLength: 255
        type: string
      name:
        example: Tech Conference 2026
        maxLength: 200
        type: string
      start_at:
        example: "2026-10-15T09:00:00Z"
        type: string
      status:
        enum:
        - draft
        - published
        - completed
        - cancelled
        example: draft
        type: string
      terms_conditions:
        example: Tickets are non-refundable.
        type: string
      ticket_tiers:
        items:
          $ref: '#/definitions/dto.CreateTicketTierChild'
        type: array
    required:
    - description
    - end_at
    - location
    - name
    - start_at
    type: object
  dto.CreateOrderRequest:
    properties:
      event_id:
        example: 1
        type: integer
      items:
        items:
          $ref: '#/definitions/dto.OrderItemInput'
        minItems: 1
        type: array
      payment_method:
        example: qris
        type: string
    required:
    - event_id
    - items
    type: object
  dto.CreateTicketTierChild:
    properties:
      description:
        example: Limited early bird tickets
        type: string
      end_sale_at:
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: Early Bird
        maxLength: 100
        type: string
      price:
        example: 150000
        minimum: 0
        type: number
      quota:
        example: 100
        minimum: 1
        type: integer
      start_sale_at:
        type: string
    required:
    - name
    type: object
  dto.CreateTicketTierRequest:
    properties:
      description:
        example: Free snacks and front row seat
        type: string
      end_sale_at:
        type: string
      event_id:
        example: 1
        type: integer
      is_active:
        example: true
        type: boolean
      name:
        example: VIP
        maxLength: 100
        type: string
      price:
        example: 350000
        minimum: 0
        type: number
      quota:
        example: 50
        minimum: 1
        type: integer
      start_sale_at:
        type: string
    required:
    - event_id
    - name
    type: object
  dto.DashboardStatsResponse:
    properties:
      paid_orders:
        type: integer
      published_events:
        type: integer
      total_checked_in:
        type: integer
      total_events:
        type: integer
      total_orders:
        type: integer
      total_revenue:
        type: number
      total_tickets_sold:
        type: integer
    type: object
  dto.EventDetailResponse:
    properties:
      banner_path:
        type: string
      banner_url:
        type: string
      created_at:
        type: string
      created_by:
        type: integer
      creator_name:
        type: string
      description:
        type: string
      end_at:
        type: string
      id:
        type: integer
      location:
        type: string
      name:
        type: string
      slug:
        type: string
      start_at:
        type: string
      status:
        type: string
      terms_conditions:
        type: string
      ticket_tiers:
        items:
          $ref: '#/definitions/dto.TicketTierResponse'
        type: array
      updated_at:
        type: string
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        example: customer@example.com
        type: string
    required:
    - email
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: fachri@example.com
        type: string
      password:
        example: secret123
        type: string
    required:
    - email
    - password
    type: object
  dto.OrderItemInput:
    properties:
      quantity:
        example: 2
        maximum: 10
        minimum: 1
        type: integer
      ticket_tier_id:
        example: 1
        type: integer
    required:
    - quantity
    - ticket_tier_id
    type: object
  dto.OrderItemResponse:
    properties:
      id:
        type: integer
      price:
        type: number
      quantity:
        type: integer
      subtotal:
        type: number
      ticket_tier_id:
        type: integer
      ticket_tier_name:
        type: string
      tickets:
        items:
          $ref: '#/definitions/dto.TicketResponse'
        type: array
    type: object
  dto.OrderResponse:
    properties:
      created_at:
        type: string
      event_id:
        type: integer
      event_name:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/dto.OrderItemResponse'
        type: array
      order_code:
        type: string
      payment_details:
        $ref: '#/definitions/dto.PaymentDetailResponse'
      payment_status:
        type: string
      total_amount:
        type: number
      total_tickets:
        type: integer
      user_id:
        type: integer
    type: object
  dto.PaymentDetailResponse:
    properties:
      gateway_reference:
        type: string
      paid_at:
        type: string
      payment_method:
        type: string
      qr_code_url:
        type: string
      redirect_url:
        type: string
      snap_token:
        type: string
      va_number:
        type: string
    type: object
  dto.PaymentWebhookRequest:
    properties:
      callback_token:
        description: Xendit compatibility fields
        type: string
      gross_amount:
        type: string
      order_code:
        type: string
      order_id:
        type: string
      payment_method:
        type: string
      payment_type:
        type: string
      reference_id:
        type: string
      signature_key:
        type: string
      status:
        type: string
      status_code:
        description: Midtrans notification fields
        type: string
      transaction_id:
        type: string
      transaction_status:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: fachri@example.com
        maxLength: 150
        type: string
      name:
        example: Fachri Ramadhan
        maxLength: 150
        minLength: 2
        type: string
      password:
        example: secret123
        minLength: 6
        type: string
      phone:
        example: "081234567890"
        maxLength: 25
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.ResetPasswordRequest:
    properties:
      new_password:
        example: new_secret123
        minLength: 6
        type: string
      token:
        example: a1b2c3d4e5f6...
        type: string
    required:
    - new_password
    - token
    type: object
  dto.TicketResponse:
    properties:
      checked_in_at:
        type: string
      code:
        type: string
      customer_name:
        type: string
      event_name:
        type: string
      id:
        type: integer
      status:
        type: string
      ticket_tier_name:
        type: string
    type: object
  dto.TicketTierResponse:
    properties:
      description:
        type: string
      end_sale_at:
        type: string
      event_id:
        type: integer
      id:
        type: integer
      is_active:
        type: boolean
      is_available:
        type: boolean
      name:
        type: string
      price:
        type: number
      quota:
        type: integer
      remaining_quota:
        type: integer
      start_sale_at:
        type: string
    type: object
  dto.UpdateEventRequest:
    properties:
      description:
        example: Updated description
        type: string
      end_at:
        example: "2026-11-01T17:00:00Z"
        type: string
      location:
        example: Bali Nusa Dua
        maxLength: 255
        type: string
      name:
        example: Tech Conference 2026 Updated
        maxLength: 200
        type: string
      start_at:
        example: "2026-11-01T09:00:00Z"
        type: string
      status:
        enum:
        - draft
        - published
        - completed
        - cancelled
        example: published
        type: string
      terms_conditions:
        example: Updated terms
        type: string
    required:
    - description
    - end_at
    - location
    - name
    - start_at
    - status
    type: object
  dto.UpdateEventStatusRequest:
    properties:
      status:
        enum:
        - draft
        - published
        - completed
        - cancelled
        example: published
        type: string
    required:
    - status
    type: object
  dto.UpdateProfileRequest:
    properties:
      name:
        example: Fachri Ramadhan
        maxLength: 150
        minLength: 2
        type: string
      phone:
        example: "081234567899"
        maxLength: 25
        type: string
    required:
    - name
    type: object
  dto.UpdateTicketTierRequest:
    properties:
      description:
        example: Front row VIP seats
        type: string
      end_sale_at:
        type: string
      is_active:
        example: true
        type: boolean
      name:
        example: VIP Pass
        maxLength: 100
        type: string
      price:
        example: 400000
        minimum: 0
        type: number
      quota:
        example: 60
        minimum: 1
        type: integer
      start_sale_at:
        type: string
    required:
    - name
    type: object
  dto.UpdateUserRoleRequest:
    properties:
      role_id:
        enum:
        - 1
        - 2
        - 3
        example: 2
        type: integer
    required:
    - role_id
    type: object
  dto.UserProfile:
    properties:
      created_at:
        type: string
      email:
        example: fachri@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Fachri Ramadhan
        type: string
      phone:
        example: "081234567890"
        type: string
      role_id:
        example: 3
        type: integer
      role_name:
        example: customer
        type: string
    type: object
  utils.APIResponse:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  utils.PaginatedData:
    properties:
      items: {}
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@eventify.local
    name: Eventify Support Team
  description: Production-Ready RESTful API for Eventify Platform (Web Admin, Panitia
    Organizer, Customer Portal, & Flutter Mobile QR Scanner).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Eventify API
  version: "1.0"
paths:
  /api/v1/admin/dashboard:
    get:
      description: Summary of events, orders, tickets sold, attendance, and revenue
      produces:
      - application/json
      responses:
        "200":
          description: Dashboard metrics
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.DashboardStatsResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get admin analytics & overview metrics (Admin only)
      tags:
      - Admin - Analytics
  /api/v1/admin/events:
    get:
      description: View and filter all events from all organizers
      parameters:
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: Filter status (draft, published, completed, cancelled)
        in: query
        name: status
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Events list
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/utils.PaginatedData'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/dto.EventDetailResponse'
                        type: array
                    type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List all events with all statuses (Admin only)
      tags:
      - Admin - Events
  /api/v1/admin/events/{id}/status:
    put:
      consumes:
      - application/json
      description: Moderation tool to publish, complete, or cancel an event
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: New status payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateEventStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Status updated
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.EventDetailResponse'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Approve or change event status (Admin only)
      tags:
      - Admin - Events
  /api/v1/admin/orders:
    get:
      description: Retrieve all orders across the entire platform
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: All orders
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/utils.PaginatedData'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/dto.OrderResponse'
                        type: array
                    type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List all orders (Admin only)
      tags:
      - Admin - Orders
  /api/v1/admin/users:
    get:
      description: Paginated list of registered users
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Users retrieved
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/utils.PaginatedData'
                  - properties:
                      items:
                        items:
                          $ref: '#/definitions/dto.UserProfile'
                        type: array
                    type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: List all users (Admin only)
      tags:
      - Admin - Users
  /api/v1/admin/users/{id}/role:
    put:
      consumes:
      - application/json
      description: 'Update role of a specific user (1: Admin, 2: Panitia, 3: Customer)'
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: Role update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Role updated successfully
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Change user role (Admin only)
      tags:
      - Admin - Users
  /api/v1/auth/change-password:
    put:
      consumes:
      - application/json
      description: Change password for the current authenticated user
      parameters:
      - description: Change Password Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated successfully
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Current password incorrect or validation error
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Change user password
      tags:
      - Authentication
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Generates a secure reset token sent to email (simulated return
        for API development)
      parameters:
      - description: Forgot Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset instructions sent
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Request password reset token
      tags:
      - Authentication
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT bearer token
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "400":
          description: Invalid credentials or request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Login user
      tags:
      - Authentication
  /api/v1/auth/me:
    get:
      description: Retrieve current authenticated user profile
      produces:
      - application/json
      responses:
        "200":
          description: Profile retrieved
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserProfile'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Get logged-in user profile
      tags:
      - Authentication
    put:
      consumes:
      - application/json
      description: Update current authenticated user profile information
      parameters:
      - description: Update Profile Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Profile updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserProfile'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.APIResponse'
      security:
      - BearerAuth: []
      summary: Update profile
      tags:
      - Authentication
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with default customer role
      parameters:
      - description: User Registration Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Register a new customer
      tags:
      - Authentication
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset account password using the token received from forgot-password
      parameters:
      - description: Reset Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password has been successfully reset
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/utils.APIResponse'
      summary: Reset password using token
      tags:
      - Authentication
  /api/v1/events:
    get:
      description: Browse all published events with filtering and search
      parameters:
      - description: Search name, location, or description
        in: query
        name: search
        type: string
      - description: Filter start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter end date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Events retrieved
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/utils.PaginatedData'
                  - properties:
                      items:
